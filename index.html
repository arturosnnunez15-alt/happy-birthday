<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>¡Feliz Cumpleaños! ✨🌸</title>
  <style>
    /* Estilos generales */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: radial-gradient(circle at center, #1b1b3a 0%, #0b0b1a 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      overflow: hidden;
      color: #fff;
      padding: 20px;
      position: relative;
    }

    /* Canvas de Fuegos Artificiales */
    #canvas-fireworks {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    /* Globos Flotantes Pastel */
    .balloon-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      pointer-events: none;
      z-index: 2;
    }

    .balloon {
      position: absolute;
      bottom: -120px;
      width: 48px;
      height: 60px;
      border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
      animation: floatUp 9s infinite linear;
      opacity: 0.85;
      box-shadow: inset -5px -5px 12px rgba(0, 0, 0, 0.15), inset 5px 5px 12px rgba(255, 255, 255, 0.45);
    }

    .balloon::after {
      content: "";
      position: absolute;
      bottom: -14px;
      left: 50%;
      transform: translateX(-50%);
      width: 1.5px;
      height: 18px;
      background: rgba(255, 255, 255, 0.5);
    }

    @keyframes floatUp {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 0.9;
      }
      100% {
        transform: translateY(-125vh) rotate(18deg);
        opacity: 0.1;
      }
    }

    /* Tarjeta estilo Cristal Templado (Glassmorphism) */
    .glass-card {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 32px;
      padding: 40px 28px;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5), inset 0 0 15px rgba(255, 255, 255, 0.08);
      text-align: center;
      max-width: 400px;
      width: 100%;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: fadeInCard 1.5s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
    }

    @keyframes fadeInCard {
      0% {
        opacity: 0;
        transform: translateY(30px) scale(0.95);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* Encabezado e Insignia */
    .badge {
      background: linear-gradient(135deg, rgba(255, 182, 193, 0.3), rgba(255, 105, 180, 0.3));
      border: 1px solid rgba(255, 192, 203, 0.4);
      padding: 6px 18px;
      border-radius: 20px;
      font-size: 0.85rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #ffd1dc;
      margin-bottom: 16px;
      backdrop-filter: blur(5px);
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      background: linear-gradient(135deg, #fff 30%, #ffb7c5 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 16px;
      line-height: 1.2;
      filter: drop-shadow(0 0 12px rgba(255, 183, 197, 0.3));
    }

    /* Mensaje Festivo */
    .message {
      font-size: 1.05rem;
      color: #f0e6ef;
      line-height: 1.65;
      font-weight: 300;
      margin-bottom: 24px;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
    }

    /* Ramo de Flores Animado e Iluminado */
    .flower-container {
      width: 160px;
      height: 160px;
      margin: 10px 0 20px;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      filter: drop-shadow(0 0 20px rgba(255, 105, 180, 0.4));
      animation: floatFlower 3s ease-in-out infinite;
    }

    @keyframes floatFlower {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-8px) scale(1.03); }
    }

    .flower-svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    /* Efectos de destello sutil */
    .sparkle {
      position: absolute;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 10px #fff, 0 0 20px #ffb7c5;
      animation: sparkleAnim 2s infinite ease-in-out;
    }

    .sparkle-1 { top: 15%; left: 20%; animation-delay: 0s; }
    .sparkle-2 { top: 25%; right: 15%; animation-delay: 0.7s; }
    .sparkle-3 { bottom: 20%; left: 25%; animation-delay: 1.4s; }

    @keyframes sparkleAnim {
      0%, 100% { opacity: 0.2; transform: scale(0.6); }
      50% { opacity: 1; transform: scale(1.4); }
    }

    /* Pie de mensaje */
    .subtext {
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.6);
      margin-top: 8px;
      font-style: italic;
    }
  </style>
</head>
<body>

  <!-- Canvas de Fuegos Artificiales -->
  <canvas id="canvas-fireworks"></canvas>

  <!-- Contenedor de Globos Pastel -->
  <div class="balloon-container" id="balloons"></div>

  <!-- Tarjeta Cristal Templado -->
  <div class="glass-card">
    <div class="badge">Un día especial ✨</div>
    <h1>¡Feliz Cumpleaños! 🎉</h1>
    
    <p class="message">
      Avanza paso a paso, a tu propio ritmo. Que hoy y siempre tu vida se llene de luz, risas y nunca dejes de crecer, preciosa. ✨🌸
    </p>

    <!-- Ramo de Flores Iluminado -->
    <div class="flower-container">
      <div class="sparkle sparkle-1"></div>
      <div class="sparkle sparkle-2"></div>
      <div class="sparkle sparkle-3"></div>

      <svg class="flower-svg" viewBox="0 0 200 200">
        <!-- Envoltorio/Lazo del Ramo -->
        <path d="M 75 140 L 125 140 L 110 185 Q 100 190 90 185 Z" fill="rgba(255, 240, 245, 0.85)" stroke="#ffb7c5" stroke-width="2"/>
        <path d="M 85 140 Q 100 150 115 140 Q 100 135 85 140" fill="#ff69b4"/>
        
        <!-- Tallos -->
        <path d="M 100 140 L 100 80" stroke="#7bc043" stroke-width="4" stroke-linecap="round"/>
        <path d="M 100 140 L 75 85" stroke="#7bc043" stroke-width="3.5" stroke-linecap="round"/>
        <path d="M 100 140 L 125 85" stroke="#7bc043" stroke-width="3.5" stroke-linecap="round"/>
        <path d="M 100 140 L 60 100" stroke="#7bc043" stroke-width="3" stroke-linecap="round"/>
        <path d="M 100 140 L 140 100" stroke="#7bc043" stroke-width="3" stroke-linecap="round"/>

        <!-- Hojas -->
        <path d="M 80 110 Q 60 105 70 120 Z" fill="#9bc472"/>
        <path d="M 120 110 Q 140 105 130 120 Z" fill="#9bc472"/>

        <!-- Flor Centro (Rosa Principal) -->
        <g transform="translate(100, 75)">
          <circle cx="0" cy="0" r="22" fill="#ff4d6d" />
          <circle cx="-6" cy="-6" r="14" fill="#ff758f" />
          <circle cx="4" cy="4" r="10" fill="#ffb3c1" />
          <circle cx="0" cy="0" r="5" fill="#fff0f3" />
        </g>

        <!-- Flor Izquierda (Pastel) -->
        <g transform="translate(68, 85)">
          <circle cx="0" cy="0" r="18" fill="#ffb3c1" />
          <circle cx="-4" cy="-4" r="11" fill="#ffccd5" />
          <circle cx="0" cy="0" r="4" fill="#fff" />
        </g>

        <!-- Flor Derecha (Lavanda/Rosa) -->
        <g transform="translate(132, 85)">
          <circle cx="0" cy="0" r="18" fill="#c77dff" />
          <circle cx="-4" cy="-4" r="11" fill="#e0aaff" />
          <circle cx="0" cy="0" r="4" fill="#fff" />
        </g>

        <!-- Flor Superior Izquierda -->
        <g transform="translate(52, 105)">
          <circle cx="0" cy="0" r="13" fill="#ff85a1" />
          <circle cx="0" cy="0" r="3" fill="#ffea00" />
        </g>

        <!-- Flor Superior Derecha -->
        <g transform="translate(148, 105)">
          <circle cx="0" cy="0" r="13" fill="#f72585" />
          <circle cx="0" cy="0" r="3" fill="#ffea00" />
        </g>
      </svg>
    </div>

    <p class="subtext">Con todo el cariño del mundo 💖</p>
  </div>

  <script>
    // --- 1. GENERADOR DE GLOBOS PASTEL ---
    const balloonsContainer = document.getElementById('balloons');
    // Paleta de colores pastel suave
    const pastelColors = [
      'rgba(255, 182, 193, 0.75)', // Rosa claro
      'rgba(221, 160, 221, 0.75)', // Ciruela pastel
      'rgba(173, 216, 230, 0.75)', // Azul pastel
      'rgba(255, 222, 173, 0.75)', // Melocotón
      'rgba(152, 251, 152, 0.75)', // Verde menta
      'rgba(255, 240, 145, 0.75)'  // Amarillo suave
    ];

    const balloonCount = 20;

    for (let i = 0; i < balloonCount; i++) {
      const balloon = document.createElement('div');
      balloon.className = 'balloon';
      balloon.style.left = `${Math.random() * 92}%`;
      balloon.style.backgroundColor = pastelColors[Math.floor(Math.random() * pastelColors.length)];
      balloon.style.animationDelay = `${Math.random() * 8}s`;
      balloon.style.animationDuration = `${7 + Math.random() * 5}s`;
      balloonsContainer.appendChild(balloon);
    }

    // --- 2. ANIMACIÓN DE FUEGOS ARTIFICIALES (CANVAS) ---
    const canvas = document.getElementById('canvas-fireworks');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class Particle {
      constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.color = color;
        this.radius = Math.random() * 2.2 + 1;
        this.velocity = {
          x: (Math.random() - 0.5) * (Math.random() * 6 + 2),
          y: (Math.random() - 0.5) * (Math.random() * 6 + 2)
        };
        this.alpha = 1;
        this.friction = 0.97;
        this.gravity = 0.035;
      }

      draw() {
        ctx.save();
        ctx.globalAlpha = this.alpha;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.shadowBlur = 8;
        ctx.shadowColor = this.color;
        ctx.fill();
        ctx.restore();
      }

      update() {
        this.velocity.x *= this.friction;
        this.velocity.y *= this.friction;
        this.velocity.y += this.gravity;
        this.x += this.velocity.x;
        this.y += this.velocity.y;
        this.alpha -= 0.012;
      }
    }

    let particles = [];

    function createFirework(x, y) {
      const particleCount = 45;
      const fireworkColors = [
        '#ffb7c5', '#ff4d6d', '#ffd166', 
        '#06d6a0', '#118ab2', '#c77dff', '#ffffff'
      ];
      const color = fireworkColors[Math.floor(Math.random() * fireworkColors.length)];

      for (let i = 0; i < particleCount; i++) {
        particles.push(new Particle(x, y, color));
      }
    }

    function animate() {
      requestAnimationFrame(animate);
      
      // Fondo translúcido para dejar estela suave
      ctx.fillStyle = 'rgba(11, 11, 26, 0.2)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Frecuencia de aparición de fuegos artificiales
      if (Math.random() < 0.06) {
        createFirework(
          Math.random() * canvas.width,
          Math.random() * (canvas.height * 0.65)
        );
      }

      particles.forEach((particle, index) => {
        if (particle.alpha > 0) {
          particle.update();
          particle.draw();
        } else {
          particles.splice(index, 1);
        }
      });
    }

    // Iniciar bucle de fuegos artificiales al cargar
    animate();
  </script>
</body>
</html>

    animate();
  </script>
</body>
</html>
